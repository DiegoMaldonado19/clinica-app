name: Infraestructura

# Solo a mano, desde main y detras de la aprobacion del Environment `infra`.
# Ningun evento del repositorio corre Terraform.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Accion de Terraform
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: infra
    concurrency: infra
    permissions:
      contents: read
      id-token: write       # OIDC: credenciales de AWS de una hora, sin llaves guardadas
    env:
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_db_admin_password }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - run: terraform ${{ inputs.action }} -input=false ${{ inputs.action == 'apply' && '-auto-approve' || '' }}
