# Forma de la nube: un proyecto por entorno en la EC2 (~/clinica/<entorno>),
# con las imagenes de Docker Hub y el .env que escribe el pipeline. En local,
# compose.override.yaml se fusiona encima y da el entorno de desarrollo.
name: clinica

x-app: &app
  image: ${DOCKERHUB_USERNAME:-local}/clinica-app:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    image: ${DOCKERHUB_USERNAME:-local}/clinica-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
    # El certificado del host, uno para los tres entornos (scripts/tls.sh).
    volumes:
      - ../tls:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_started
        # nginx resuelve `app` al arrancar: si app se recrea, web se reinicia.
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://127.0.0.1:8443/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app

  # Contenedor aparte del web a proposito: un despliegue no debe matar un
  # trabajo a medio ejecutar, y las colas se escalan por su cuenta.
  worker:
    <<: *app
    command: php artisan queue:work --queue=critical,mail,documents,default --tries=3 --max-time=3600

  # Con dos instancias, cada tarea se envuelve en withoutOverlapping() sobre el
  # bloqueo `database`: solo una gana el tick (doc 03 §2.3).
  scheduler:
    <<: *app
    command: php artisan schedule:work

  # Solo cache (ADR-008): perderlo no pierde nada.
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
