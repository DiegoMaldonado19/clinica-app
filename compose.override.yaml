# Solo desarrollo. Compose lo fusiona automaticamente sobre compose.yaml.
#
#   · cambia el destino de construccion a `dev`
#   · monta el proyecto, de modo que editar un .php surte efecto en la
#     siguiente peticion sin reconstruir nada
#   · sirve http sin TLS
#   · anade los servicios que en la nube son RDS, S3 y el SMTP de Gmail
#
x-app-dev: &app-dev
  # Etiqueta propia: sin ella, `docker compose -f compose.yaml build` sobrescribe
  # la imagen de desarrollo con la de produccion y el contenedor pasa a correr
  # con www-data uid 82, que no puede escribir en el bind mount.
  image: ${APP_IMAGE:-clinica-app}-dev:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - .:/var/www/html
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    build: !reset null
    ports: !override
      - "${HTTP_PORT:-80}:8080"
    volumes: !override
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/laravel.conf:/etc/nginx/laravel.conf:ro
      - .:/var/www/html
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]

  app:
    <<: *app-dev

  worker:
    <<: *app-dev

  scheduler:
    <<: *app-dev

  mariadb:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-clinica}
      MARIADB_USER: ${DB_USERNAME:-clinica}
      MARIADB_PASSWORD: ${DB_PASSWORD:-clinica}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-clinica}
    ports:
      - "${DB_PORT_FORWARD:-3306}:3306"
    volumes:
      - mariadb:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "${REDIS_PORT_FORWARD:-6379}:6379"

  minio:
    image: &minio pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # El bucket privado tiene que existir antes de que F-08 suba el primer
  # comprobante. Se crea una vez y el contenedor termina.
  minio-init:
    image: *minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      && mc mb --ignore-existing local/${AWS_BUCKET:-clinica-archivos}
      && mc anonymous set none local/${AWS_BUCKET:-clinica-archivos}"

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Recarga en caliente del front. Escribe public/hot y el @vite de Blade
  # apunta ahi mientras el servicio este arriba.
  vite:
    image: node:24.21.0-alpine
    working_dir: /var/www/html
    # Con el uid del anfitrion: node_modules/ y public/hot quedan editables y
    # borrables desde fuera del contenedor.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

volumes:
  mariadb:
  minio:
